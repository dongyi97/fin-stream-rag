networks:
  fin-network:
    driver: bridge

services:
  # 1. Message Broker (KRaft Mode - Zookeeper 불필요)
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    restart: always
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_NUM_PARTITIONS: 1
    networks:
      - fin-network
    volumes:
      - ./kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8082:8080"  # spark-master와 포트 충돌 방지
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kraft
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - fin-network

  # 2. Data Lake (Storage)
  minio:
    image: minio/minio
    container_name: minio
    networks:
      - fin-network
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
    command: server /data --console-address ":9001"

  # 3. Vector DB
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    networks:
      - fin-network
    ports:
      - "6333:6333" # REST API & Dashboard
      - "6334:6334" # gRPC (대용량 처리 시 사용)
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: always

  # 4. Selenium Standalone Chrome (Remote WebDriver)
  selenium-chrome:
    image: selenium/standalone-chrome:latest
    container_name: selenium-chrome
    networks:
      - fin-network
    ports:
      - "4444:4444"   # Selenium Grid Hub
      - "7900:7900"   # VNC (선택적, 디버깅용)
    environment:
      - SE_VNC_NO_PASSWORD=1
      - SE_NODE_MAX_SESSIONS=5
      - SE_NODE_SESSION_TIMEOUT=300
    shm_size: 2gb
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/wd/hub/status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 5. Orchestrator (Custom Build)

  airflow:
    build:
      context: .
      dockerfile: Dockerfile-airflow
    container_name: airflow-standalone
    volumes:
      - ./dags:/opt/airflow/dags
      - ./kafka_fin:/opt/airflow/kafka_fin
      - ./rag_pipeline:/opt/airflow/rag_pipeline
    ports:
      - "8080:8080"
    networks:
      - fin-network
    environment:
      # MinIO (S3 호환) 설정
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=password123
      - MINIO_BUCKET=news-lake
      # Qdrant 설정
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      # OpenAI API 키 (docker-compose 실행 시 환경변수로 전달 필요)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Airflow AWS Provider용 (MinIO를 S3처럼 사용)
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password123
      - AWS_DEFAULT_REGION=us-east-1
    depends_on:
      - minio
      - qdrant
    command: airflow standalone


  # 6. Kafka Consumer (뉴스 정제 → MinIO 저장)
  news-consumer:
    build:
      context: .
      dockerfile: Dockerfile-consumer
    container_name: news-consumer
    networks:
      - fin-network
    environment:
      # Docker 내부 네트워크 주소 사용
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=password123
      - MINIO_BUCKET=news-lake
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_started
    restart: always
    # 로그 실시간 출력을 위해 -u (unbuffered) 옵션 사용
    command: ["python", "-u", "kafka_fin/consumer/news_refine_stream_pandas.py"]

  # 7. Distributed Processing
  spark-master:
    image: apache/spark:3.5.1
    container_name: spark-master
    networks:
      - fin-network
    ports:
      - "8083:8080"   # Master Web UI (host -> container 8080)
      - "7077:7077"   # Master RPC
    volumes:
    - ./kafka_fin/consumer:/opt/app
    command: >
      /bin/bash -c "
      /opt/spark/sbin/start-master.sh &&
      tail -f /opt/spark/logs/*
      "

  spark-worker-1:
    image: apache/spark:3.5.1
    container_name: spark-worker-1
    depends_on:
      - spark-master
    networks:
      - fin-network
    ports:
      - "8084:8081"   # Worker Web UI (container 8081)
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
    command: >
      /bin/bash -c "
      /opt/spark/sbin/start-worker.sh spark://spark-master:7077 &&
      tail -f /opt/spark/logs/*
      "

volumes:
  etcd_data:
  minio_data: